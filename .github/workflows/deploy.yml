name: Deploy Vibe Coding Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build (no actual build needed, static)
        run: |
          mkdir -p _site
          cp -r website/* _site/
          # Use absolute URLs for SEO
          sed -i 's|href="\(css/|href="/vibe-coding-wiki/css/|g' _site/*.html _site/pages/*.html
          sed -i 's|src="\(js/|src="/vibe-coding-wiki/js/|g' _site/*.html _site/pages/*.html
          sed -i 's|href="\([^/"]*\.svg\)"|href="/vibe-coding-wiki/\1"|g' _site/*.html _site/pages/*.html
          sed -i 's|href="\(data/\)"|href="/vibe-coding-wiki/\1"|g' _site/*.html _site/pages/*.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
