<script>
  // Round 1 fallback: if async loader fails, use sync terms.js
  setTimeout(() => {
    if (!window.VC_TERMS || window.VC_TERMS.length === 0) {
      console.warn('[Round 1 fallback] Loading sync terms.js');
      var s = document.createElement('script');
      s.src = '../js/terms.js';
      document.head.appendChild(s);
    }
  }, 5000);
</script>
<script src="../js/search-engine.js"></script>
<script src="../js/search.js"></script>
<script src="../js/app.js"></script>
<script>
  // Round 1: wait for async terms load
  VC_WHEN_TERMS_READY(function() {
      const data = window.VC_TERMS || [];
      const layers = window.VC_LAYERS || {};
      if (!data.length) return; // wait for VC_WHEN_TERMS_READY
      const filterBar = document.getElementById('filter-bar');
      const termList = document.getElementById('term-list');
      const termCount = document.getElementById('term-count');
    
      // URL 参数支持
      const params = new URLSearchParams(location.search);
      const urlTag = params.get('tag');
      const urlLayer = params.get('layer');
    
      let currentLayer = urlLayer || 'all';
    
      // Filter chips
      const layerChips = [{ id: 'all', name: '全部', color: '#111' }]
        .concat(Object.entries(layers).map(([k, v]) => ({ id: k, name: v.name, color: v.color })));
      filterBar.innerHTML = layerChips.map(c =>
        `<button data-layer="${c.id}" class="layer-chip" style="padding:8px 14px;border:1px solid ${currentLayer===c.id?c.color:'var(--c-line)'};background:${currentLayer===c.id?c.color:'var(--c-panel)'};color:${currentLayer===c.id?'var(--c-paper)':'var(--c-ink)'};font-size:13px;font-weight:600;cursor:pointer;letter-spacing:0.02em;font-family:var(--font-body);transition:all 0.15s;">${c.name}</button>`
      ).join('');
    
      filterBar.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        currentLayer = btn.dataset.layer;
        filterBar.querySelectorAll('button').forEach(b => {
          const c = layerChips.find(x => x.id === b.dataset.layer);
          const on = b.dataset.layer === currentLayer;
          b.style.background = on ? c.color : 'var(--c-panel)';
          b.style.color = on ? 'var(--c-paper)' : 'var(--c-ink)';
          b.style.borderColor = on ? c.color : 'var(--c-line)';
        });
        render();
      });
    
      function render() {
        const isEn = document.documentElement.getAttribute('data-lang') === 'en';
        const items = data.filter(x => {
          if (currentLayer !== 'all' && x.layer !== currentLayer) return false;
          if (urlTag && !(x.tags || []).includes(urlTag)) return false;
          return true;
        });
        const pendingCount = items.filter(x => x.status === 'pending').length;
        const officialCount = items.length - pendingCount;
        termCount.textContent = `共 ${officialCount} 条词条` + (pendingCount ? ` · 另有 ${pendingCount} 条⏳待验证` : '') + (urlTag ? ` · 标签 #${urlTag}` : '');
    
        // 分组按字母
        const grouped = {};
        items.forEach(item => {
          const letter = (item.name[0] || '').toUpperCase();
          if (!grouped[letter]) grouped[letter] = [];
          grouped[letter].push(item);
        });
    
        const letters = Object.keys(grouped).sort();
        termList.innerHTML = letters.map(letter => {
          // R7 dual-track: pending terms sort after official terms within each letter group
          const entries = grouped[letter].slice().sort((a, b) =>
            (a.status === 'pending' ? 1 : 0) - (b.status === 'pending' ? 1 : 0));
          return `
          <div style="margin-bottom:32px;">
            <div style="font-family:var(--font-rounded);font-weight:700;font-size:14px;color:var(--c-shihqing);letter-spacing:0.06em;border-bottom:1px solid var(--c-line);padding-bottom:8px;margin-bottom:12px;">${letter}</div>
            <div class="term-cards-grid">
              ${entries.map(t => {
                const layer = layers[t.layer] || { color: '#777', name: t.layer };
                return `
                <a id="${t.id}" href="../term.html?id=${t.id}" class="term-card" style="border-left:3px solid ${layer.color};">
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;">
                    <strong style="font-family:var(--font-title);font-size:16px;font-weight:700;color:var(--c-ink);">${t.zh}</strong>
                    <span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
                      <span class="layer-badge" style="background:${layer.color};">${layer.name}</span>
                      ${t.status === 'pending' ? `<span class="pending-badge">${isEn ? '⏳ Pending review' : '⏳ 待验证'}</span>` : ''}
                    </span>
                  </div>
                  <div style="font-size:12px;color:var(--c-muted);font-family:var(--font-mono);margin-bottom:8px;">${t.name}</div>
                  <p style="font-size:13px;color:var(--c-ink-soft);line-height:1.6;margin:0;">${t.shortDesc.substring(0, 140)}${t.shortDesc.length > 140 ? '...' : ''}</p>
                </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
        }).join('');
      }
    
      render();
    
      // R7 dual-track: re-render on language toggle so pending badges follow lang
      window.addEventListener('vclang-change', render);
    
  });
</script>
<script>
  // Service Worker registration (Round 2: offline cache)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/vibe-coding-wiki/sw.js', {
        scope: '/vibe-coding-wiki/'
      }).then(reg => {
        console.log('[SW] Registered, scope:', reg.scope);
      }).catch(err => {
        console.warn('[SW] Registration failed:', err);
      });
    });
  }
</script>
