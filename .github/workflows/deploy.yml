name: Deploy Vibe Coding Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          set -e
          mkdir -p _site
          # Copy website/ excluding heavy/dev artifacts
          rsync -a --exclude='node_modules' --exclude='.git' \
                    --exclude='*.pyc' --exclude='__pycache__' \
                    --exclude='tests' --exclude='vitest.config.js' \
                    --exclude='package*.json' \
                    website/ _site/

          # Inject <base href="/vibe-coding-wiki/"> right after <head>
          # so all relative paths (css/, js/, data/, pages/, term.html) resolve correctly
          # Using perl for cross-platform safety (works on both BSD and GNU)
          find _site -type f -name "*.html" -exec perl -i -pe 's|<head>|<head>\n  <base href="/vibe-coding-wiki/">|' {} +

          echo "=== _site contents ==="
          find _site -type f -not -path "*/node_modules/*" | head -25
          echo "=== Sample base href injection ==="
          head -5 _site/index.html
          echo "---"
          head -5 _site/pages/glossary.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
