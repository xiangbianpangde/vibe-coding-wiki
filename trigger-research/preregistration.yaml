# ============================================================
# 21. Final Word
# ============================================================
final_statement: |
  This project establishes behavioral trigger effects only.
  Internal latent-mode claims require separate mechanistic evidence
  (Level 3) via open-weight activation intervention.
  Black-box accuracy alone is necessary but NOT sufficient.
  Safest paper title: "Latent Capability Trigger Hypothesis — behavioral evidence"
  NOT: "we discovered internal latent modes"