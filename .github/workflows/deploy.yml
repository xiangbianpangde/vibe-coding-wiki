name: Deploy Vibe Coding Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          set -e
          mkdir -p _site
          # Use rsync to exclude heavy/dev directories
          rsync -a --exclude='node_modules' --exclude='.git' --exclude='*.pyc' --exclude='__pycache__' --exclude='tests' --exclude='vitest.config.js' --exclude='package*.json' website/ _site/
          # Rewrite relative paths to absolute paths under repo subpath
          find _site -type f -name "*.html" -exec sed -i 's|href="css/|href="/vibe-coding-wiki/css/|g; s|src="js/|src="/vibe-coding-wiki/js/|g; s|href="data/|href="/vibe-coding-wiki/data/|g' {} +
          # Also rewrite SVG/og-image/sitemap/robots references
          find _site -type f -name "*.html" -exec sed -i 's|href="favicon.svg"|href="/vibe-coding-wiki/favicon.svg"|g; s|href="og-image.svg"|href="/vibe-coding-wiki/og-image.svg"|g; s|href="sitemap.xml"|href="/vibe-coding-wiki/sitemap.xml"|g; s|href="robots.txt"|href="/vibe-coding-wiki/robots.txt"|g' {} +
          # List output
          echo "=== _site contents ==="
          find _site -type f | head -20
          echo "=== Sample rewritten paths ==="
          grep -h "vibe-coding-wiki" _site/index.html | head -3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
