  <!-- 底部品牌 -->
  <g transform="translate(80, 580)">
    <text font-family="M PLUS Rounded 1c, sans-serif" font-size="14" font-weight="700" fill="#777" letter-spacing="2">v2.1 · 2025-08-17 · KARTHY 2025-02</text>
