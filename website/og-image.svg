    </g>
    <g transform="translate(0, 88)">
      <rect width="420" height="48" fill="#FFFFFF" stroke="#DDD6CA"/>
      <text x="20" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="20" font-weight="600" fill="#0F1A20">L2</text>
      <text x="60" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="18" fill="#0F1A20">方法论层</text>
      <rect x="0" y="0" width="6" height="48" fill="#4F84FF"/>
    </g>
    <g transform="translate(0, 146)">
