      <text x="20" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="20" font-weight="600" fill="#0F1A20">L3</text>
      <text x="60" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="18" fill="#0F1A20">技术概念层</text>
      <rect x="0" y="0" width="6" height="48" fill="#00A86B"/>
    </g>
    <g transform="translate(0, 204)">
      <rect width="420" height="48" fill="#FFFFFF" stroke="#DDD6CA"/>
      <text x="20" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="20" font-weight="600" fill="#0F1A20">L4</text>
      <text x="60" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="18" fill="#0F1A20">工具平台层</text>
      <rect x="0" y="0" width="6" height="48" fill="#2E5D8C"/>
    </g>
    <g transform="translate(0, 262)">
      <rect width="420" height="48" fill="#FFFFFF" stroke="#DDD6CA"/>
      <text x="20" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="20" font-weight="600" fill="#0F1A20">L5</text>
      <text x="60" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="18" fill="#0F1A20">质量治理层</text>
      <rect x="0" y="0" width="6" height="48" fill="#D4AF37"/>
    </g>
    <g transform="translate(0, 320)">
      <rect width="420" height="48" fill="#FFFFFF" stroke="#DDD6CA"/>
      <text x="20" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="20" font-weight="600" fill="#0F1A20">L6</text>
      <text x="60" y="32" font-family="PingFang SC, Avenir Next, sans-serif" font-size="18" fill="#0F1A20">风险度量层</text>
      <rect x="0" y="0" width="6" height="48" fill="#F43E06"/>
    </g>
